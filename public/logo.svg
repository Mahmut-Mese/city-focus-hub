<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-labelledby="title desc">
  <title id="title">The Leadenhall Works logo</title>
  <desc id="desc">Square mark with a simple building glyph and stacked text reading 'THE LEADENHALL WORKS'.</desc>
  <rect x="6" y="6" width="188" height="188" rx="6" ry="6" fill="none" stroke="#000" stroke-width="12"/>
  <!-- simple building icon inside the square -->
  <g transform="translate(24,28)">
    <rect x="0" y="110" width="140" height="48" fill="#000"/>
    <rect x="26" y="36" width="28" height="122" fill="#000"/>
    <rect x="72" y="78" width="48" height="80" fill="#000"/>
  </g>

  <!-- stacked text on the right -->
  <g transform="translate(220,40)" fill="#000" font-family="Helvetica, Arial, sans-serif" font-weight="700">
    <text x="0" y="30" font-size="28">THE</text>
    <text x="0" y="78" font-size="36">LEADENHALL</text>
    <text x="0" y="128" font-size="36">WORKS</text>
  </g>
</svg>
