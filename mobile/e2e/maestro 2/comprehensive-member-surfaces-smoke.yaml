appId: com.leadenhallworks.mobile
---
# Requires login-smoke.yaml to run first so the simulator has an authenticated SecureStore session.
- launchApp
- openLink: "leadenhallworks://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- extendedWaitUntil:
    visible: "Home Dashboard"
    timeout: 30000
- assertVisible: "Quick actions"
- assertVisible: "View membership"
- assertVisible: "My Bookings"
- openLink: "leadenhallworks://invoices"
- extendedWaitUntil:
    visible: "Invoices"
    timeout: 30000
- openLink: "leadenhallworks://membership"
- extendedWaitUntil:
    visible: "Membership"
    timeout: 30000
- openLink: "leadenhallworks://bookings"
- extendedWaitUntil:
    visible: "My Bookings"
    timeout: 30000
- openLink: "leadenhallworks://book-room"
- extendedWaitUntil:
    visible: "Choose room and time"
    timeout: 30000
- openLink: "leadenhallworks://dashboard"
- extendedWaitUntil:
    visible: "Home Dashboard"
    timeout: 30000
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 30000
- assertVisible: "Member Access"
