appId: com.leadenhallworks.mobile
---
# Requires login-smoke.yaml to run first so the simulator has an authenticated SecureStore session.
- launchApp
- openLink: "leadenhallworks://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- extendedWaitUntil:
    visible: "Home Dashboard"
    timeout: 30000
- tapOn: "Book a room"
- extendedWaitUntil:
    visible: "Choose room and time"
    timeout: 30000
- assertVisible: "Room"
- assertVisible: "Date"

