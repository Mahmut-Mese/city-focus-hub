appId: com.leadenhallworks.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: "leadenhallworks://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- extendedWaitUntil:
    visible: "Account"
    timeout: 60000
- openLink: "leadenhallworks://meeting-rooms/book"
- extendedWaitUntil:
    visible: "Book this room"
    timeout: 30000
- assertVisible: "Book this room"
