appId: com.leadenhallworks.mobile
---
- launchApp:
    clearState: true
    clearKeychain: true
- openLink: "leadenhallworks://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- extendedWaitUntil:
    visible: "Account"
    timeout: 60000
- assertVisible: "THE LEADENHALL WORKS"
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- assertVisible:
    id: "login-email"
- assertVisible:
    id: "login-password"
- assertVisible:
    id: "submit-login"
- assertVisible:
    id: "forgot-password-link"
- assertVisible:
    id: "create-account-link"
